acceptance_criteria:
  - Semantics is a named, discoverable protocol concern rather than an implicit part of the generic design gate.
  - New semantic-bearing architecture and delivery packets link an approved semantic contract before implementation.
  - Non-semantic packets can explicitly declare that semantics are not in scope without unnecessary contract overhead.
  - The semantic contract supports fuzzy, emerging, structured, stable, and deprecated maturity without requiring all meaning to be known upfront.
  - Universal semantic-contract fields and domain profiles have examples, cross-references, and validation coverage.
  - Semantic invariants, terms, states, transitions, boundary contracts, failure behavior, compatibility assumptions, open questions, and change history are traceable to evidence and handoff review.
  - Historical completed records remain valid through a documented conservative migration rule.
  - All local record, schema, documentation, and test validation passes, with limitations recorded.
