title: "Fix records scope gate false positives and gitleaks fingerprint allowlist"
objective: >
  The records CI job fails on dependency-only PRs, evidence/handoff pushes,
  and force-pushes because the "Enforce changed packet scope" step requires a
  work-packet file in every diff. Secret scanning fails because the new GPG
  key fingerprint is not allowlisted. This packet extracts the gate logic
  into a tested script that skips non-records diffs, claims artifacts by
  filename, and skips unreachable base SHAs, and updates the gitleaks
  allowlist for both public GPG key fingerprints.
