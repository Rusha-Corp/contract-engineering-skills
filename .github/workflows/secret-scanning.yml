name: Secret scanning

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: secret-scanning-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out complete history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install evidence-policy validator dependency
        run: python -m pip install --disable-pip-version-check --no-input --require-hashes -r requirements-ci.txt
      - name: Install verified Gitleaks binary
        env:
          GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
        run: |
          set -eu
          archive="${RUNNER_TEMP}/gitleaks_8.24.3_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP/gitleaks" gitleaks
          chmod 0555 "$RUNNER_TEMP/gitleaks/gitleaks"
      - name: Block credential filenames
        run: |
          set -eu
          forbidden="$(find . -path './.git' -prune -o -type f \
            \( -name '.env' -o \( -name '.env.*' ! -name '.env.example' \) \
            -o -name '*.pem' -o -name '*.key' \
            -o -name '*.p12' -o -name '*.pfx' -o -name 'credentials*.json' \
            -o -name 'service-account*.json' \) -print -quit)"
          if [ -n "$forbidden" ]; then
            printf 'blocked credential filename: %s\n' "$forbidden" >&2
            exit 1
          fi
      - name: Validate evidence policy contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import yaml

          policy = yaml.safe_load(Path("templates/evidence-policy.yaml").read_text())
          required = {
              "evidence_policy_version", "packet_id", "classification",
              "contains_sensitive_data", "data_categories", "redaction",
              "secret_scan", "access", "retention", "telemetry", "incident_ref",
          }
          missing = required - policy.keys()
          if missing:
              raise SystemExit(f"evidence policy missing fields: {sorted(missing)}")
          if policy["redaction"]["required"] is not True:
              raise SystemExit("evidence redaction must be required")
          if policy["secret_scan"]["required"] is not True:
              raise SystemExit("evidence secret scanning must be required")
          if policy["telemetry"]["raw_content_allowed"] is not False:
              raise SystemExit("raw telemetry content must be denied by default")
          print("evidence policy contract valid")
          PY
      - name: Scan Git history
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
        run: |
          set -eu
          "$RUNNER_TEMP/gitleaks/gitleaks" detect --source . --redact \
            --exit-code 1 --no-banner --config "$GITLEAKS_CONFIG"
      - name: Scan working tree and generated files
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
        run: |
          set -eu
          "$RUNNER_TEMP/gitleaks/gitleaks" dir . --redact \
            --exit-code 1 --no-banner --config "$GITLEAKS_CONFIG"
      - name: Verify negative secret fixture is rejected
        run: |
          set -eu
          fixture="${RUNNER_TEMP}/secret-fixture"
          mkdir -p "$fixture"
          {
            header="$(printf '%s%s%s' '-----BEGIN ' 'PRIVATE ' 'KEY-----')"
            footer="$(printf '%s%s%s' '-----END ' 'PRIVATE ' 'KEY-----')"
            printf '%s\n' "$header"
            printf '%s\n' 'synthetic-negative-fixture-only'
            printf '%s\n' "$footer"
          } > "$fixture/fixture.txt"
          if "$RUNNER_TEMP/gitleaks/gitleaks" dir "$fixture" --redact \
            --exit-code 1 --no-banner --config .gitleaks.toml; then
            printf '%s\n' 'negative secret fixture was not rejected' >&2
            exit 1
          fi
          printf '%s\n' 'negative secret fixture rejected without printing its contents'
