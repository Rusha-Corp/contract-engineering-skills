summary: >
  Added a "Core terms" section to README.md defining the protocol's four
  nested terms: an epic optionally groups related tasks, a task is a
  bounded body of work owning an objective and a set of packets,
  "workstream" is the user-facing label for a task (records keep
  task_id), and a packet is the bounded unit of delivery inside a task.
  The section also states that packet dependencies form a partial order —
  they say which packets must finish before another may start, packet IDs
  do not imply a sequence, and independent packets may proceed in
  parallel. Documentation only; no schema, skill, template, or code
  changes.
