name: Protocol validation

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: protocol-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  records:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the submitted revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install record validator dependency
        run: python -m pip install --disable-pip-version-check --no-input --require-hashes -r requirements-ci.txt
      - name: Verify workflow security invariants
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          def validate(workflow):
              action_refs = re.findall(
                  r"^\s*uses:\s*([^\s#]+)", workflow, re.MULTILINE
              )
              if not action_refs or any(
                  not re.fullmatch(r"[^@]+@[0-9a-f]{40}", ref)
                  for ref in action_refs
              ):
                  raise SystemExit("all third-party actions must use a full commit SHA")
              required = (
                  "permissions:\n  contents: read",
                  "persist-credentials: false",
                  "timeout-minutes: 10",
                  "cancel-in-progress: true",
              )
              missing = [item for item in required if item not in workflow]
              if missing:
                  raise SystemExit(
                      f"missing workflow security invariant(s): {missing}"
                  )
              privileged_triggers = ("pull_request_" + "target:", "workflow_" + "run:")
              if any(trigger in workflow for trigger in privileged_triggers):
                  raise SystemExit(
                      "privileged pull-request workflow triggers are prohibited"
                  )

          workflow = Path(".github/workflows/protocol-validation.yml").read_text()
          validate(workflow)
          for unsafe in (
              workflow.replace("@3d3c42e5aac5ba805825da76410c181273ba90b1", "@v4"),
              workflow.replace("timeout-minutes: 10", ""),
          ):
              try:
                  validate(unsafe)
              except SystemExit:
                  pass
              else:
                  raise SystemExit("negative workflow security test unexpectedly passed")
          PY
      - name: Validate contract records
        run: python scripts/validate-contract-records.py
      - name: Validate canonical tracker partitions
        run: |
          python scripts/validate-tracker.py --root .contract-engineering
          python scripts/render-tracker.py --root .contract-engineering --check
      - name: Run repository unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Validate normative JSON schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          required = {"$schema", "$id", "title", "type"}
          schemas = sorted(Path("schemas").glob("*.json"))
          if not schemas:
              raise SystemExit("no JSON schemas found")
          for path in schemas:
              document = json.loads(path.read_text())
              missing = required - document.keys()
              if missing:
                  raise SystemExit(f"{path}: missing schema metadata {sorted(missing)}")
              if document["type"] != "object":
                  raise SystemExit(f"{path}: top-level schema must be an object")
          print(f"validated {len(schemas)} JSON schema documents")
          PY

      - name: Verify lock and immutable source alignment
        run: |
          python - <<'PY'
          import hashlib
          import re
          import subprocess
          from pathlib import Path
          import yaml

          lock = yaml.safe_load(Path(".contract-engineering/protocol.lock.yaml").read_text())
          ref = lock["protocol"]["ref"]
          if not re.fullmatch(r"[0-9a-f]{40}", ref):
              raise SystemExit("protocol lock ref must be a full immutable commit")
          subprocess.run(
              ["git", "cat-file", "-e", f"{ref}^{{commit}}"],
              check=True,
          )
          for name, pin in lock["skills"].items():
              content = subprocess.check_output(
                  ["git", "show", f"{ref}:skills/{name}/SKILL.md"],
                  text=False,
              )
              actual_hash = hashlib.sha256(content).hexdigest()
              if actual_hash != pin["sha256"]:
                  raise SystemExit(f"{name}: lock hash does not match {ref}")
              version = re.search(
                  rb"^version:\s*(\S+)\s*$", content, re.MULTILINE
              )
              if not version or version.group(1).decode() != str(pin["version"]):
                  raise SystemExit(f"{name}: lock version does not match {ref}")
          print(f"verified six skill pins against {ref}")
          PY

  stable-release-gate:
    name: Stable release gate
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out tagged revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Require release attestation
        run: |
          test -f .contract-engineering/release-attestation.yaml
          gpg --batch --no-tty --import .contract-engineering/release-signing-key.asc
          python - <<'PY'
          import hashlib
          import os
          import re
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path
          import yaml

          attestation = yaml.safe_load(
              Path(".contract-engineering/release-attestation.yaml").read_text()
          )
          required = (
              "subject",
              "publisher",
              "provenance",
              "review",
              "verification",
              "revocation",
          )
          missing = [field for field in required if not attestation.get(field)]
          if missing:
              raise SystemExit(f"release attestation is incomplete: {missing}")
          review = attestation["review"]
          if not review.get("independent_approver"):
              exception_ref = review.get("exception_ref")
              if not exception_ref:
                  raise SystemExit(
                      "release attestation lacks independent approval or an exception"
                  )
              exception_path = (
                  Path(".contract-engineering/decisions") / f"{exception_ref}.yaml"
              )
              if not exception_path.is_file():
                  raise SystemExit(f"release exception is missing: {exception_path}")
              exception = yaml.safe_load(exception_path.read_text())
              required_exception = (
                  "proposal",
                  "controls",
                  "review_owner",
                  "review_at",
                  "success_measure",
                  "status",
                  "approved_by",
                  "approved_at",
                  "expires_at",
                  "rollback_ref",
              )
              missing_exception = [
                  field for field in required_exception if not exception.get(field)
              ]
              if missing_exception or exception.get("status") != "approved":
                  raise SystemExit(
                      f"release exception is incomplete or not approved: "
                      f"{exception_ref}"
                  )
              try:
                  approved_at = datetime.fromisoformat(
                      str(exception["approved_at"]).replace("Z", "+00:00")
                  )
                  expires_at = datetime.fromisoformat(
                      str(exception["expires_at"]).replace("Z", "+00:00")
                  )
                  review_at = datetime.fromisoformat(
                      str(exception["review_at"]).replace("Z", "+00:00")
                  )
              except ValueError as exc:
                  raise SystemExit(
                      f"release exception timestamps are invalid: {exception_ref}"
                  ) from exc
              now = datetime.now(timezone.utc)
              if approved_at.tzinfo is None or expires_at.tzinfo is None or review_at.tzinfo is None:
                  raise SystemExit(
                      f"release exception timestamps must include timezone: "
                      f"{exception_ref}"
                  )
              if expires_at <= approved_at or expires_at <= now or review_at > expires_at:
                  raise SystemExit(
                      f"release exception is expired or has invalid review window: "
                      f"{exception_ref}"
                  )
              if not re.fullmatch(r"[0-9a-f]{40}", str(exception["rollback_ref"])):
                  raise SystemExit(
                      f"release exception rollback_ref must be an immutable commit: "
                      f"{exception_ref}"
                  )
          if attestation["verification"].get("result") != "pass":
              raise SystemExit("release attestation is not verified")
          if attestation["revocation"].get("status") != "active":
              raise SystemExit("release attestation is revoked or unknown")
          tag_release = os.environ.get("GITHUB_REF_NAME", "")
          if not tag_release.startswith("v"):
              raise SystemExit("stable release gate requires a version tag")
          if "-" in tag_release.removeprefix("v"):
              raise SystemExit(
                  f"tag {tag_release} is a development tag, not a stable release"
              )
          expected_release = tag_release.removeprefix("v")
          if attestation["subject"].get("release") != expected_release:
              raise SystemExit(
                  f"tag {tag_release} does not match attestation release "
                  f"{attestation['subject'].get('release')}"
              )
          subject_commit = attestation["subject"].get("commit")
          if not subject_commit:
              raise SystemExit("release attestation lacks subject commit")
          # The tag points to the attestation-bearing commit; the attestation
          # subject is either that same commit (single-commit model) or its
          # exact content parent (two-commit model). Verify the relationship.
          tag_commit = os.environ.get("GITHUB_SHA", "")
          if tag_commit and tag_commit != subject_commit:
              # Two-commit model: subject must be the direct parent of the tag.
              parent = subprocess.run(
                  ["git", "rev-parse", "HEAD^"],
                  capture_output=True, text=True,
              ).stdout.strip()
              if not parent or parent != subject_commit:
                  raise SystemExit(
                      f"tag commit {tag_commit} does not match attestation "
                      f"subject commit {subject_commit} and subject is not "
                      f"the direct parent of the tag"
                  )
          publisher = attestation.get("publisher", {})
          if not publisher.get("identity") or not publisher.get("signing_system"):
              raise SystemExit("release attestation lacks publisher identity or signing system")
          if not publisher.get("signature_ref"):
              raise SystemExit("release attestation lacks publisher signature reference")
          signature = subprocess.run(
              ["git", "verify-tag", "--raw", tag_release],
              capture_output=True,
              text=True,
          )
          if signature.returncode != 0:
              raise SystemExit("release tag signature verification failed")
          status = signature.stdout + signature.stderr
          valid_signatures = [
              line.split()[2]
              for line in status.splitlines()
              if line.startswith("[GNUPG:] VALIDSIG ")
          ]
          if len(valid_signatures) != 1:
              raise SystemExit("release tag must have exactly one valid signature")
          publisher_key = publisher.get("authentication_ref")
          if not publisher_key or valid_signatures[0] != publisher_key:
              raise SystemExit(
                  "release tag signature does not match publisher authentication_ref"
              )
          provenance = attestation.get("provenance", {})
          if not provenance.get("source_commit"):
              raise SystemExit("release attestation lacks provenance source commit")
          if provenance["source_commit"] != subject_commit:
              raise SystemExit(
                  f"provenance source_commit {provenance['source_commit']} "
                  f"does not match subject commit {subject_commit}"
              )
          artifacts = attestation["subject"].get("artifacts")
          if not isinstance(artifacts, list) or not artifacts:
              raise SystemExit("release attestation lacks artifact hashes")
          for artifact in artifacts:
              if not isinstance(artifact, dict):
                  raise SystemExit("release artifact entry must be a mapping")
              artifact_path = artifact.get("path")
              expected_hash = artifact.get("sha256")
              if (
                  not isinstance(artifact_path, str)
                  or not isinstance(expected_hash, str)
                  or not re.fullmatch(r"[0-9a-f]{64}", expected_hash)
              ):
                  raise SystemExit("release artifact entry has invalid path or hash")
              path = Path(artifact_path)
              if path.is_absolute() or ".." in path.parts or not path.is_file():
                  raise SystemExit(f"release artifact path is unsafe or missing: {path}")
              actual_hash = hashlib.sha256(path.read_bytes()).hexdigest()
              if actual_hash != expected_hash:
                  raise SystemExit(f"release artifact hash mismatch: {path}")
          PY
