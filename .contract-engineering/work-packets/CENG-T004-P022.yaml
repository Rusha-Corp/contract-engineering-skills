acceptance_criteria:
  - >-
    The security workflow runs OpenSSF Scorecard on main and pull requests,
    skips Scorecard only for version-tag refs, and retains tag-triggered CodeQL
    and workflow-invariant coverage.
  - >-
    The three Contract Spark SVGs are self-contained, script-free, font-free,
    accessible, and recognizable at 16px, 64px, and documentation sizes.
  - >-
    README and visual-identity guidance explain the name, meaning, palette,
    accessibility, and reuse rules.
  - >-
    The packet records the Scorecard limitation accurately and does not claim a
    skipped tag Scorecard run as a pass.
  - >-
    Local workflow, SVG, record, unit, link, and security validation passes
    without changing release tags or consumer locks.
acceptance_contract:
  version: 1
  criteria:
    - id: CENG-T004-P022-AC001
      statement: >-
        The security workflow Scorecard job has an explicit condition that
        skips version-tag refs while CodeQL and workflow-invariants remain
        unconditional.
      expected_result: >-
        Scorecard if-condition excludes tag refs; CodeQL and
        workflow-invariants have no tag-excluding condition.
      verification_method: workflow YAML inspection
      verification_command: >-
        python3 -c "import yaml,sys; w=yaml.safe_load(open('.github/workflows/security.yml')); s=w['jobs']['scorecard']; assert 'if' in s and 'github.ref_type' in s['if'], 'scorecard missing ref guard'; c=w['jobs']['codeql']; assert 'if' not in c or 'ref_type' not in c.get('if',''), 'codeql has tag guard'; print('ok')"
      evidence_refs:
        - CENG-T004-P022-EV001
      failure_result: >-
        Scorecard runs on tags or CodeQL/workflow-invariants are skipped on
        tags.
      validation_ref: CENG-T004-P022-VAL001
    - id: CENG-T004-P022-AC002
      statement: >-
        All three Contract Spark SVGs are valid XML, contain accessible title
        and desc elements, declare a viewBox, contain no script tags, no
        external references, and use only the approved palette.
      expected_result: >-
        xmllint parses each SVG; no script, href, or off-palette color is
        present; title and desc exist in each file.
      verification_method: XML and content inspection
      verification_command: >-
        python3 scripts/validate-svg-assets.py assets/contract-spark/
      evidence_refs:
        - CENG-T004-P022-EV001
      failure_result: >-
        An SVG is malformed, inaccessible, off-palette, or contains
        scripts or external references.
      validation_ref: CENG-T004-P022-VAL002
    - id: CENG-T004-P022-AC003
      statement: >-
        docs/visual-identity.md and README.md document the Contract Spark name,
        meaning, palette, accessibility, and reuse rules.
      expected_result: >-
        Both files mention Contract Spark, the palette, accessibility, and
        reuse constraints.
      verification_method: documentation content inspection
      evidence_refs:
        - CENG-T004-P022-EV001
      failure_result: >-
        Name, palette, accessibility, or reuse guidance is missing.
      validation_ref: CENG-T004-P022-VAL004
    - id: CENG-T004-P022-AC004
      statement: >-
        The packet evidence records the Scorecard tag limitation as a known
        scope decision and does not claim a skipped tag Scorecard run as a pass.
      expected_result: >-
        Evidence states Scorecard is skipped on tags by design and that
        tag-triggered security relies on CodeQL and workflow-invariants.
      verification_method: evidence inspection
      evidence_refs:
        - CENG-T004-P022-EV001
      failure_result: >-
        Evidence falsely claims a tag Scorecard pass or omits the skip
        rationale.
      validation_ref: CENG-T004-P022-VAL003
    - id: CENG-T004-P022-AC005
      statement: >-
        Local record validation, unit tests, Markdown link checks, and pinned
        Gitleaks scans pass without changing release tags or the consumer
        protocol lock.
      expected_result: >-
        Validator, unittest, link check, and Gitleaks all report pass; git
        refs for v2.2.0, v2.2.1, and v2.3.0 are unchanged.
      verification_method: local command execution
      verification_command: >-
        python3 scripts/validate-contract-records.py && python3 -m unittest discover -s tests -p 'test_*.py' && python3 scripts/check-markdown-links.py && gitleaks detect --no-git --verbose
      evidence_refs:
        - CENG-T004-P022-EV001
      failure_result: >-
        Any validation command fails or a release tag is modified.
      validation_ref: CENG-T004-P022-VAL005
