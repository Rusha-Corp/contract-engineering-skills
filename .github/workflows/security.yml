name: Security checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "43 4 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-invariants:
    name: Workflow security invariants
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out submitted revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Reject unsafe workflow changes
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          def validate(path, text):
              refs = re.findall(r"^\s*uses:\s*([^\s#]+)", text, re.MULTILINE)
              if any(not re.fullmatch(r"[^@]+@[0-9a-f]{40}", ref) for ref in refs):
                  raise SystemExit(f"{path}: action is not pinned to a full SHA")
              for required in ("permissions:", "timeout-minutes:", "cancel-in-progress:"):
                  if required not in text:
                      raise SystemExit(f"{path}: missing {required}")
              if "pull_request_" + "target:" in text:
                  raise SystemExit(f"{path}: privileged pull-request trigger denied")

          paths = sorted(
              list(Path(".github/workflows").glob("*.yml"))
              + list(Path(".github/workflows").glob("*.yaml"))
          )
          for path in paths:
              validate(path, path.read_text())
          sample = paths[0].read_text()
          for unsafe in (
              sample.replace("@11bd71901bbe5b1630ceea73d27597364c9af683", "@v4"),
              sample.replace("permissions:", "permissionz:"),
          ):
              try:
                  validate("synthetic-negative-workflow", unsafe)
              except SystemExit:
                  pass
              else:
                  raise SystemExit("negative workflow test unexpectedly passed")
          print("workflow security invariants valid")
          PY

  dependency-review:
    name: Dependency and license review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Review changed dependencies
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
          license-check: true
          vulnerability-check: true
          deny-licenses: GPL-3.0-only,AGPL-3.0-only
          comment-summary-in-pr: never

  codeql:
    name: CodeQL analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out submitted revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          languages: python
          queries: security-extended
      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          upload: false

  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out complete history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: false
