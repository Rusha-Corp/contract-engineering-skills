receiver_notes: >-
  Rejected on independent acceptance review. AC001 passes: CONTRIBUTING.md
  links to docs/release-integrity.md, whose release-parity rule requires a
  verified signed tag, matching non-draft GitHub Release, and hash-recorded
  artifacts. AC002 is not accepted as fully evidenced: EV001 records local
  validation and documentation-only intent, but its changed-file statement
  includes generated tracker projection and tracker index changes that are not
  present in changed_resources or their declared hashes. AC003 fails: EV001
  explicitly says release publication gates remain pending; no concrete
  evidence verifies a signed v2.7.1 tag, non-draft GitHub Release, matching
  release commit, or uploaded artifact hashes. The release-attestation.yaml
  also has transparency_ref PENDING_HOSTED_VALIDATION and records independent
  approval before this review, so it cannot serve as a completed attestation.
  The high-risk two-person gate, receiver authorization, hosted validation,
  attestation-commit binding, signed-tag verification, GitHub Release parity,
  and artifact publication gates therefore remain unmet. Preserve the
  release-path:v2.7.1 lock and resubmit after the attestation metadata is
  finalized and all hosted and publication evidence is available.
