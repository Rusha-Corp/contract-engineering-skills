decision: "Use the approved CENG-T014-DC001 trust boundaries and enforce path confinement, manifest hashes, localhost-only serving, offline HTML policy, SVG sanitization, and fail-closed Mermaid rendering."
scope:
  - "scripts/preview-design.py"
