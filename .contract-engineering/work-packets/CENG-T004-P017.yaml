acceptance_criteria:
- The release attestation is complete, redacted, and bound to the exact release source revision, artifacts, publisher, provenance, independent approval, verification, active revocation state, and rollback reference.
- Local release validation passes and hosted security/release gates pass before publication is treated as complete.
- Publisher signature and provenance verification are recorded without storing private signing material or credentials.
- Stable v2.2.0 tag and remote publication are verified against the intended immutable release revision.
- The consumer lock remains on the prior verified release until publication and attestation verification succeed.
validation_plan:
- id: CENG-T004-P017-VAL001
  kind: release
  skill: phased-engineering-execution
  checks:
  - Validate all repository records, schemas, tests, workflow invariants, YAML, Markdown links, lock/source alignment, and changed-path scope.
  - Verify release commit, tag target, remote ref, and stable release metadata.
  expected: local and remote release validation passes
- id: CENG-T004-P017-VAL002
  kind: security
  skill: security-assurance
  checks:
  - Verify publisher identity, signature/provenance, independent approval, attestation subject, artifact hashes, revocation status, and rollback reference.
  - Verify hosted gitleaks, CodeQL, dependency review, and OpenSSF Scorecard gates or record a blocking failure.
  - Verify positive and negative release-integrity cases for altered subject, artifact, approval, expiry, and revocation.
  expected: security release gate passes with no unresolved high or critical findings
validation_limitations:
- Local gitleaks, CodeQL, dependency review, and OpenSSF Scorecard execution is unavailable; hosted gates are mandatory before publication completion.
- Remote publication and signature verification cannot be claimed until the remote operation returns a verifiable result.
- The configured release key is available in the dedicated GPG home and has
  been backed up outside the repository; hosted security gates remain pending.
- The release key is passphrase-protected; non-interactive signing failed
  because no TTY or passphrase was available. Unlock it interactively before
  retrying the signed tag.
