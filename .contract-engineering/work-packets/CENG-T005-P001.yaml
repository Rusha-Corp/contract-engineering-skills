acceptance_criteria:
- The workflow pins every third-party action to a full commit SHA.
- Checkout credentials are not persisted into the worktree.
- CI dependencies are hash-pinned or installed from an approved trusted source.
- Workflow timeout, concurrency, token permissions, and untrusted-PR behavior are
  explicit.
- Negative tests or static checks reject mutable action tags and unsafe workflow settings.
