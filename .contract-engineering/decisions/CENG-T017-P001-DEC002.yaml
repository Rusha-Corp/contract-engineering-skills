title: "Separate content acceptance from final publication parity"
proposal: "Accept the v2.7.1 documentation content and attestation preparation before the external publication step, then require the signed tag, non-draft GitHub Release, and artifact hashes as the final release gate."
alternatives_considered:
  - "Require the GitHub Release to exist before independent content acceptance."
  - "Publish without independent acceptance and review afterward."
decision: "The independent reviewer accepts the exact content commit and release metadata first. Publication then remains blocked until the signed tag, matching non-draft GitHub Release, and artifact hashes are verified together."
scope:
  - "CENG-T017-P001 acceptance contract"
  - "v2.7.1 publication gate"
controls:
  - "No stable-release claim is made before the final parity evidence passes."
  - "The reviewer acceptance binds the content commit and packet scope, not an unpublished tag."
  - "The final handoff must record the tag, GitHub Release, asset names, and SHA-256 values."
