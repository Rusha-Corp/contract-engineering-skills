acceptance_criteria:
  - "The spec defines a user-request intake flow that maps requests to packets, computes dependency chains, and presents shortest-path plans."
  - "The spec defines dependency triage rules that distinguish truly blocking from over-declared dependencies using scope.in overlap and import analysis."
  - "The spec defines fast-track rules for user-requested work with clear applicability criteria and one-workstream-rule interaction."
  - "The spec defines a project onboarding checklist and device-login-flow integration for fast multi-project onboarding."
  - "The spec defines a proactive-workflow-improvement protocol so agents identify and record CE/Task Master edge cases during normal work."
  - "The threat model covers dependency-relaxation risks (hidden coupling, incomplete intermediate states), onboarding risks (unauthorized project access), and improvement-protocol risks (scope creep, noise)."
  - "The user approves the design before any implementation packet is claimed."
acceptance_contract:
  version: 1
  criteria:
    - id: CENG-T036-P001-AC001
      statement: "The intake flow maps user requests to packets and presents shortest-path plans."
      expected_result: >
        The spec describes the mapping procedure (keyword search, scope
        match, cancelled-packet handling), dependency-chain computation,
        and shortest-path presentation with trade-offs.
      verification_method: review
      verification_command: "Review the intake-flow section of the spec."
      evidence_refs:
        - CENG-T036-P001-EV001
      failure_result: "The agent ad-hoc asks the user to pick shortcuts in chat instead of following a structured flow."
      validation_ref: CENG-T036-P001-VAL001
    - id: CENG-T036-P001-AC002
      statement: "Dependency triage rules distinguish blocking from over-declared dependencies."
      expected_result: >
        The spec defines objective criteria (scope.in file overlap, import
        analysis, shared abstraction dependency) and a formal relaxation
        process recorded as a Decision record.
      verification_method: review
      verification_command: "Review the dependency-triage section of the spec."
      evidence_refs:
        - CENG-T036-P001-EV001
      failure_result: "Dependencies are never questioned or are relaxed without a recorded decision."
      validation_ref: CENG-T036-P001-VAL001
    - id: CENG-T036-P001-AC003
      statement: "Fast-track rules integrate with the one-workstream rule without violating it."
      expected_result: >
        The spec states when fast-track applies, when it doesn't, and how
        it interacts with the one-workstream rule (in-workstream dependency
        ordering may be relaxed; cross-task one-workstream is not bypassed).
      verification_method: review
      verification_command: "Review the fast-track section against the one-workstream rule."
      evidence_refs:
        - CENG-T036-P001-EV001
      failure_result: "Fast-track silently violates the one-workstream rule or has no applicability criteria."
      validation_ref: CENG-T036-P001-VAL001
    - id: CENG-T036-P001-AC004
      statement: "Project onboarding and proactive-improvement protocols are defined."
      expected_result: >
        The spec defines an onboarding checklist (protocol.lock, ce:sync,
        device login flow, workspace:connect), a proactive-improvement
        protocol (edge-case recording without scope creep), and multi-project
        workflow guidance.
      verification_method: review
      verification_command: "Review the onboarding and improvement sections."
      evidence_refs:
