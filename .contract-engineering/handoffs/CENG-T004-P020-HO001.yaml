receiver_notes: >-
  Independent review accepted. All six criteria pass. (1) The issue is
  accurately recorded: the stable-release-gate job was conditional on version
  tags but the workflow trigger accepted only main pushes, so the v2.2.1
  attestation gate could not run; v2.2.1 remains unchanged and is not
  republished (scope.out excludes retagging). (2) All three workflows
  (protocol-validation, secret-scanning, security) now trigger on v* tag
  pushes, all third-party action refs remain full immutable commit SHAs, and
  the stable gate reads GITHUB_REF_NAME, requires a v-prefixed tag, and
  matches the tag release name against release-attestation.yaml subject
  release 2.2.1. (3) The validator enforces a 25-row active index cap, 50-row
  task-shard cap under tracker-shards/<TASK-ID>.md, task ownership of shard
  rows, and rejects duplicate/orphan/over-limit rows while preserving archive
  partition invariants; unit tests cover these paths. (4) Documentation and
  skills give a deterministic 14-day active-packet review, terminal-only
  move-not-delete compaction, recovery on failed moves, no invented Stale
  state, and no manual long-history burden. (5) Packet actor, approval
  (two_person, reviewer distinct from author), trust, dependencies (P019
  Complete/accepted), scope, baseline, rollback, evidence, and validation are
  valid. (6) No private data or unsafe release/tag mutation is introduced;
  workflows use contents:read and persist-credentials:false. Changed-resource
  hashes and scope digest accepted as declared (file-tool-only restriction
  prevents independent recomputation). Subsequent release gates (new tag,
  hosted tag-run workflow) are NOT claimed as passed and remain pending.
