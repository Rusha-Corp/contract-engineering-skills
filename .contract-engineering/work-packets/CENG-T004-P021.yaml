acceptance_criteria:
- The schema and template define a structured acceptance contract with stable criterion IDs, measurable statements, expected results, verification methods, and evidence references, while retaining a legacy format for historical packets.
- The validator fails closed on missing criterion-to-evidence mappings, empty evidence, duplicate validation IDs, criteria with no verification path, and incomplete high-risk packet controls.
- The reviewer-agent instructions require criterion-by-criterion evaluation, reject aspirational or non-measurable criteria, and require exact revision, scope digest, changed-resource hashes, validation outputs, limitations, and next action before acceptance.
- The stable release gate validates tag format, tag-to-attestation source-commit relationship, attestation release name, artifact hashes, signature/provenance fields, and active revocation status.
- The two-commit release model is documented: the tag points to the attestation-bearing commit; the attestation subject is its exact content parent; the gate verifies that relationship.
- Local record, workflow, parser, unit, link, and security validation passes; v2.2.0 and v2.2.1 remain unchanged.
