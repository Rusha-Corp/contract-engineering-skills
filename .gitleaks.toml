title = "Contract Engineering secret scanning"

[extend]
useDefault = true

[[rules]]
id = "private-key-material"
description = "Private key material is never valid repository content"
regex = '''-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'''
keywords = ["PRIVATE KEY"]

[allowlist]
description = "The release attestation records a public GPG fingerprint, not a credential"
condition = "AND"
paths = ['''^\.contract-engineering/release-attestation\.yaml$''']
regexes = ['''E0695C669AF8BD1ED298EF6EB2EECCB9F7AA535D''']
