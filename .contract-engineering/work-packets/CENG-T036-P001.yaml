title: "Design user-request intake, dependency triage, fast-track, and project onboarding"
objective: >
  Specify and obtain approval for four protocol improvements:
  (1) A structured user-request intake flow that maps a user's "implement X"
  request to existing or new packets, computes the dependency chain, and
  presents a shortest-path plan — not a wall of blocking dependencies.
  (2) A dependency triage protocol that distinguishes truly blocking
  dependencies from conservatively over-declared ones, with a formal
  relaxation process recorded as Decision records rather than ad-hoc chat.
  (3) Fast-track rules for user-requested work that allow dependency
  relaxation without cancelling the blocking packet, with clear criteria
  for when fast-track applies and when it doesn't.
  (4) A project onboarding and proactive-workflow-improvement framework so
  that agents don't just churn out code — they identify CE/Task Master edge
  cases and improvements, and new projects can onboard quickly via the
  device login flow, enabling multi-project perspectives.
open_questions:
  - "What distinguishes a truly blocking dependency from a conservatively declared one, and can this be determined automatically from packet scope.in overlaps and import analysis?"
  - "How does fast-track interact with the one-workstream rule — can a packet be claimed out of dependency order within an in-progress task without violating the rule?"
  - "Does dependency relaxation need a new record type, or do existing Decision records suffice with a `dependency_rationale` field?"
  - "What project-onboarding checklist lets a new project start working under CE in under 30 minutes, and how does the device login flow gate that?"
  - "How should agents proactively identify and record workflow improvements during normal packet work without scope-creeping the current packet?"
