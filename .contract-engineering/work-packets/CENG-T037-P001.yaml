acceptance_criteria:
  - "The spec defines where grooming fits in the CE lifecycle with rationale."
  - "The spec defines a severity taxonomy (blocker / warning / informational) for grooming findings."
  - "The spec defines the grooming report format (Markdown, per-finding sections, copy-pasteable fix instructions)."
  - "The spec defines when grooming is triggered (manual, pre-sync, closure)."
  - "The threat model covers risks of deferred grooming (broken packets silently excluded from sync, unlinked records lost on archive)."
  - "The user approves the design before any implementation packet is claimed."
acceptance_contract:
  version: 1
  criteria:
    - id: CENG-T037-P001-AC001
      statement: "The spec defines where grooming fits in the CE lifecycle with rationale."
      expected_result: >
        The spec analyzes pre-baseline, dedicated maintenance task, and
        closure gate options, and recommends a hybrid approach with
        rationale for why it fits the existing state machine without
        adding new gates.
      verification_method: review
      verification_command: "Review the lifecycle-placement section of the spec."
      evidence_refs: []
      failure_result: "The spec does not justify its placement choice or contradicts the existing state machine."
      validation_ref: CENG-T037-P001-VAL001
    - id: CENG-T037-P001-AC002
      statement: "The spec defines a severity taxonomy for grooming findings."
      expected_result: >
        The spec defines three severity levels (blocker for broken YAML,
        warning for unresolved refs, informational for unlinked records)
        with clear criteria and examples for each.
      verification_method: review
      verification_command: "Review the severity-taxonomy section of the spec."
      evidence_refs: []
      failure_result: "Severity levels are undefined or ambiguous."
      validation_ref: CENG-T037-P001-VAL001
    - id: CENG-T037-P001-AC003
      statement: "The spec defines the grooming report format."
      expected_result: >
        The spec defines the Markdown report structure (summary, broken
        packets with fix hints, unresolved refs grouped by category,
        unlinked records grouped by subdir) with no truncation and
        per-error fix instructions.
      verification_method: review
      verification_command: "Review the report-format section of the spec."
      evidence_refs: []
      failure_result: "The report format is undefined or truncates findings."
      validation_ref: CENG-T037-P001-VAL001
    - id: CENG-T037-P001-AC004
      statement: "The spec defines when grooming is triggered."
      expected_result: >
        The spec defines the trigger model: tm doctor writes the report
        on every run when issues are found, --fix repairs dirs/lock/skills
        but does not auto-fix YAML, and the user feeds the report to their
        LLM or claims a maintenance packet.
      verification_method: review
      verification_command: "Review the trigger-model section of the spec."
      evidence_refs: []
      failure_result: "The trigger model is undefined or ambiguous."
      validation_ref: CENG-T037-P001-VAL001
    - id: CENG-T037-P001-AC005
      statement: "The threat model covers risks of deferred grooming."
      expected_result: >
        TM001 covers broken packets silently excluded from sync, unlinked
        records lost on archive, and grooming report misuse risks.
      verification_method: review
      verification_command: "Review TM001 against the spec's design surfaces."
      evidence_refs: []
      failure_result: "A grooming risk is not covered."
      validation_ref: CENG-T037-P001-VAL002
validation_plan:
  - id: CENG-T037-P001-VAL001
    kind: design-review
    command: "Review the spec, DEC001, and DG001 for completeness and consistency."
    expected: "All four grooming workflow aspects (placement, taxonomy, report format, triggers) are specified with clear rules and integration points."
  - id: CENG-T037-P001-VAL002
    kind: security
    skill: security-assurance
    checks:
      - "Deferred grooming cannot silently exclude packets from sync audits."
      - "Grooming report does not expose secrets or authorize unauthorized changes."
      - "The grooming workflow cannot scope-creep a packet or bypass gates."
    expected: "No unresolved blocking security finding."
