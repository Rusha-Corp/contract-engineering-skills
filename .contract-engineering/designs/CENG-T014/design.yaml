    kind: design
    reviewer: user
    status: accepted
    notes: "User approved the proposed root plugin ownership and governed lifecycle."
  - review_id: CENG-T014-DC001-R002
    kind: architecture
    reviewer: user
    status: accepted
    notes: "User approved the Mermaid architecture and sanitized SVG data-flow artifact."
acceptance_contract:
  version: 1
  criteria:
    - id: CENG-T014-DC001-AC001
      statement: "The root plugin composes with Superpowers without duplicate workflow ownership."
      expected_result: "Plugin packaging and skill routing preserve the approved ownership boundary."
      verification_method: inspect
      evidence_refs: [CENG-T014-P011-EV001]
      failure_result: "Contract Engineering duplicates or overrides a Superpowers-owned workflow skill."
      validation_ref: CENG-T014-P011-VAL001
    - id: CENG-T014-DC001-AC002
      statement: "Design and packet admission are revision-bound and fail closed."
      expected_result: "Only approved design revisions with required reviews, scope, criteria, and packet gates reach workers."
      verification_method: execute
      verification_command: "python3 scripts/validate-design-contracts.py --root .contract-engineering/designs && python3 scripts/validate-admission.py --root .contract-engineering --all-ready"
      evidence_refs: [CENG-T014-P011-EV001]
      failure_result: "A worker packet can be admitted without the required design or governance evidence."
      validation_ref: CENG-T014-P011-VAL002
    - id: CENG-T014-DC001-AC003
      statement: "Visual architecture artifacts are canonical, offline, and sanitized."
      expected_result: "Mermaid source and derived SVG contain no remote loads, scripts, or unsafe event handlers."
      verification_method: execute
      verification_command: "python3 scripts/validate-design-contracts.py --root .contract-engineering/designs"
      evidence_refs: [CENG-T014-P011-EV001]
      failure_result: "Visual artifacts load remote content or contain executable SVG behavior."
      validation_ref: CENG-T014-P011-VAL003
