summary: >
  Fixes two release-machinery design flaws: the attestation's
  transparency_ref was structurally pending forever (the hosted validation
  run is triggered by the tag the attestation is signed into), and the
  protocol lock was pinned to pre-rebase SHAs that stranded the pin.
  Attestation version 2 drops transparency_ref (evidence: public CI run +
  GitHub Release body); a new finalize_release.py scripts the post-merge
  lock pin and attestation rewrite in the single-commit shape the gates
  accept.
