title: "Design packet grooming workflow and tm doctor reporting"
objective: >
  Specify where packet grooming (fixing broken YAML, unresolved sidecar
  refs, and unlinked governance records) fits in the CE workflow, and
  define the grooming report format that tm doctor produces so users can
  feed it to their LLM for manual repair.
open_questions:
  - "Is packet grooming a pre-baseline step, a dedicated maintenance task, or a closure gate?"
  - "Should grooming be triggered manually (tm doctor), automatically (ce:sync pre-flight), or at task closure?"
  - "What is the severity taxonomy for grooming findings (blocker / warning / informational)?"
  - "How does the grooming report feed back into the workflow — does an agent claim a grooming packet, or does the user fix manually?"
