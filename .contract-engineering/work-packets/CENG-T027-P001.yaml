title: "Fix scope-gate archive fallback and roll terminal packets to archive"
objective: >
  The packet-scope gate cannot attribute archive-partition moves:
  enforce_packet_scope.py builds an archive fallback path for claiming
  packets, but packet_scope() resolves claiming packets from the active
  partition only, so an archived claiming packet contributes no scope
  rules and any archival diff fails the gate. This blocked CENG-T004-P017's
  archival (deferred in CENG-T004-P017-DEC001) and the long-overdue
  rollover of terminal packets. This packet fixes the fallback, adds a
  validator check that handoff base/head revisions resolve to real Git
  objects (the CENG-T024 handoffs shipped a fabricated base SHA that no
  validator caught), then rolls every terminal packet (Cancelled P017 plus
  all Complete packets) to the archive partition, leaving only this packet
  active. Cross-cutting because the gate fix and the archival must land
  atomically: the fix is only exercisable against real records by
  performing the move, and the move is blocked without the fix; separate
  child packets would leave either an unused fix or an unarchivable
  state. Concern owners: protocol tooling (scripts/) and the contract
  records (.contract-engineering/).
