design_contract_version: 1
design_id: CENG-T014-DC001
task_id: CENG-T014
status: approved
design_type: architecture
title: "Contract Engineering root plugin and governed execution flow"
problem:
  statement: "Contract Engineering needs a machine-readable architecture and data-flow contract before visual runtime, governance, hooks, packaging, and migration packets can be admitted."
  users:
    - "Users approving engineering designs and packet scope"
    - "Factory Droid workers executing bounded packets"
    - "Superpowers users composing planning and implementation workflows"
  impact: "Implementation packets could bypass the approved architecture, visual review, or Superpowers ownership boundaries."
  urgency: high
  constraints:
    - "Compose with Superpowers without duplicating its workflow skills."
    - "Keep previews offline and localhost-only."
    - "Treat repository validators and CI as the authoritative admission boundary."
    - "Bind approval to the exact artifact manifest revision."
open_questions: []
scope:
  in:
    - ".factory-plugin/"
    - "skills/contract-design/"
    - "skills/contract-review/"
    - "skills/contract-admission/"
    - "skills/contract-visual-review/"
    - "skills/contract-handoff-acceptance/"
    - "commands/"
    - "droids/"
    - "hooks/"
    - "scripts/"
    - "runtime/"
    - "schemas/"
    - "templates/"
    - "tests/"
    - ".github/workflows/"
    - "docs/"
  out:
    - "Changes to the Superpowers plugin or its installed global skills."
    - "Remote design services, telemetry, or network-loaded preview assets."
    - "Production deployment or external platform writes."
architecture:
  proposal: "Use a root-level Factory plugin that composes with Superpowers. Superpowers owns brainstorming, plans, worktrees, TDD, debugging, subagents, reviews, and branch finishing. Contract Engineering owns design contracts, visual artifacts, packet admission, evidence, handoffs, and audit records."
  components:
    - "Root-level Factory marketplace and plugin manifests."
    - "Machine-readable design contracts and artifact manifests."
    - "Offline Mermaid source and sanitized SVG artifacts."
    - "Localhost-only preview runtime."
    - "Governance skills, commands, droids, hooks, and CI validators."
    - "Packet-scoped evidence, handoffs, and tracker records."
  data_flows:
    - "Superpowers brainstorming and plan -> design contract -> visual and architecture review -> user approval."
    - "Approved design contract -> packet scope and criterion traceability -> admission gate."
    - "Admitted packet -> bounded worker execution -> evidence and handoff -> CI and tracker audit."
  trust_boundaries:
    - "User approval boundary between proposed design artifacts and approved design contract."
    - "Repository admission boundary between approved records and worker execution."
    - "Local preview boundary between untrusted artifact content and localhost rendering."
alternatives:
  - id: ALT001
    proposal: "Fork Superpowers and merge Contract Engineering into the fork."
    benefits:
      - "Single installation surface."
    costs:
      - "Duplicate workflow ownership."
      - "Upstream synchronization and skill-name conflicts."
    rejected_reason: "The approved compatibility decision requires composition rather than forking."
  - id: ALT002
    proposal: "Allow workers to infer design and packet gates from prose."
    benefits:
      - "Less record maintenance."
    costs:
      - "Non-deterministic admission."
      - "No revision-bound approval or evidence."
    rejected_reason: "The project requires fail-closed repository validation and auditable handoffs."
decisions:
  security:
    - "Preview inputs are treated as untrusted; path traversal, remote assets, scripts, and unsafe SVG content are rejected."
    - "No credentials, session material, or telemetry are loaded by the offline runtime."
  data:
    - "Design records, artifact manifests, packet records, evidence, handoffs, and tracker events remain canonical repository records."
  compatibility:
    - "Superpowers owns general workflow skills; Contract Engineering uses unique skill names and additive bootstrap behavior."
  observability:
    - "Validators emit deterministic failures and CI records validation, admission, tracker, and artifact results."
  rollback:
    - "Revert the packet or plugin revision to the last accepted handoff; preserve prior records and release locks through governed transitions."
