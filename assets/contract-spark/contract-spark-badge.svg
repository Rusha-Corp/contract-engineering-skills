<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" width="200" height="80" role="img" aria-labelledby="cs-badge-title cs-badge-desc">
  <title id="cs-badge-title">Contract Spark badge</title>
  <desc id="cs-badge-desc">A rounded badge with a deep-navy background, the Contract Spark mark on the left, and the label Contract-Driven Protocol in white on the right.</desc>

  <!-- Badge background -->
  <rect x="1" y="1" width="198" height="78" rx="12" ry="12" fill="#173F5F" stroke="#20639B" stroke-width="2"/>

  <!-- Mark (left, centered at 40,40) -->
  <circle cx="40" cy="26" r="8" fill="none" stroke="#3CAEA3" stroke-width="2.8"/>
  <circle cx="54" cy="40" r="8" fill="none" stroke="#F6D55C" stroke-width="2.8"/>
  <circle cx="40" cy="54" r="8" fill="none" stroke="#20639B" stroke-width="2.8"/>
  <circle cx="26" cy="40" r="8" fill="none" stroke="#ED553B" stroke-width="2.8"/>
  <circle cx="40" cy="40" r="7" fill="#173F5F" stroke="#FFFFFF" stroke-width="1"/>
  <path d="M 36.5 40.5 L 38.5 42.5 L 43.5 37.5" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Label (right) -->
  <text x="74" y="36" font-family="sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Contract-Driven</text>
  <text x="74" y="54" font-family="sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Protocol</text>
</svg>
