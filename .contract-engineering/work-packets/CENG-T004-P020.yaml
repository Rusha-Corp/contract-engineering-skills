acceptance_criteria:
- Version-tag pushes trigger the protocol, secret-scanning, and security workflows, and the stable release gate validates the tagged release name against its attestation.
- The active tracker has a documented bounded layout with task-based shard files, while archive/work-packets remains the terminal packet partition.
- The validator discovers active tracker shards, rejects duplicate or orphan rows across the active index and shards, and preserves archive partition invariants.
- The protocol defines deterministic stale-record and terminal-packet compaction rules that retain audit evidence and do not archive active or unconfirmed work.
- User-facing templates and repository guidance explain the zero-manual-maintenance path, including when to shard, when to compact, and how to recover from failed moves.
- Local record, workflow, parser, unit, link, and security validation passes; v2.2.0 and v2.2.1 remain unchanged.
