- The canonical release-parity rule states that a stable release requires both a verified signed tag and a matching non-draft GitHub Release.
- v2.7.1 is based directly on v2.7.0 and contains no functional changes.
- The signed v2.7.1 tag, GitHub Release, and uploaded artifacts resolve to the same release commit and pass hosted gates.
acceptance_contract:
  version: 1
  criteria:
  - id: CENG-T017-P001-AC001
    statement: The repository has one canonical release-parity rule.
    expected_result: CONTRIBUTING.md points to docs/release-integrity.md, which defines the signed-tag and matching non-draft GitHub Release requirement.
    verification_method: inspect
    verification_command: rg -n "release.parity|non-draft GitHub Release|signed.*tag" CONTRIBUTING.md docs/release-integrity.md
    evidence_refs:
    - CENG-T017-P001-EV001
    failure_result: Release guidance permits a tag-only or Release-only stable publication.
    validation_ref: CENG-T017-P001-VAL001
  - id: CENG-T017-P001-AC002
    statement: v2.7.1 is a documentation-only patch from v2.7.0.
    expected_result: The release diff contains only approved documentation, changelog, governance, attestation, and release metadata changes.
    verification_method: execute
    verification_command: git diff --name-only v2.7.0 HEAD
    evidence_refs:
    - CENG-T017-P001-EV001
    failure_result: Functional source behavior changes are included without approval.
    validation_ref: CENG-T017-P001-VAL002
  - id: CENG-T017-P001-AC003
    statement: The stable release has parity across Git, GitHub Releases, and artifacts.
    expected_result: The signed v2.7.1 tag and non-draft GitHub Release point to the same commit, and each uploaded asset hash is recorded.
    verification_method: execute
    verification_command: gh release view v2.7.1 --repo Rusha-Corp/contract-engineering-skills --json tagName,isDraft,targetCommitish,assets
    evidence_refs:
    - CENG-T017-P001-EV001
    failure_result: A stable release exists in only one publication surface or has mismatched artifacts.
    validation_ref: CENG-T017-P001-VAL003
