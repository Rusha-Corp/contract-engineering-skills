title: "Define workstream, epic, task, and packet terminology in documentation"
objective: >
  The protocol records use "task" and "epic" with machine-oriented IDs
  (task_id, epic_id), while consumers such as Task Master present tasks to
  users as "workstreams" and never see the relationship between epics,
  tasks, and packets stated anywhere in this repository. This packet adds
  a "Core terms" section to README.md that defines the four nested terms:
  an epic optionally groups related tasks, a task is a bounded body of
  work owning an objective and a set of packets, "workstream" is the
  user-facing label for a task, and a packet is the bounded unit of
  delivery inside a task. The section also states that packet
  dependencies form a partial order: they say which packets must finish
  before another may start, not a sequence implied by IDs, and
  independent packets may proceed in parallel. Documentation-only, no
  schema, skill, template, or code changes.
