title: 'Release flow hardening: drop transparency_ref, script lock finalization'
objective: 'Two release-machinery flaws surfaced during the v3.1.0 release. First,
  the attestation''s verification.transparency_ref is structurally pending forever:
  the hosted validation run is triggered by the tag the attestation is signed into,
  so it can never cite its own run (chicken-and-egg). The field is dropped: attestation_version
  2 forbids transparency_ref and any PENDING placeholder value; version 1 attestations
  stay verifiable. Transparency evidence lives in the public CI run and the GitHub
  Release body. Second, protocol.lock.yaml was pinned to a pre-rebase SHA inside a
  release packet commit, stranding the pin when history was rewritten. A new scripts/finalize_release.py
  pins the lock and rewrites the attestation only after release content lands on main
  in final form, in the single commit whose parent is the content commit (the only
  shape both the stable gate and the lock verifier accept).

  '
